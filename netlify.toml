# Versão em site (link para iPhone e computador). O Netlify lê este arquivo sozinho.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O app usa endereços com # (HashRouter), então basta servir o index.html.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
